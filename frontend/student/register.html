<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | FUTA E-Voting</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <main class="registration-container">

        <div class="registration-card">

            <!-- Logo -->
            <div class="logo-container">
                <img src="../assets/futa-logo.png" alt="FUTA Logo">
            </div>

            <!-- Heading -->
            <div class="registration-heading">
                <h1>Create Your Account</h1>

                <p>
                    Register to access the electronic voting platform.
                </p>
            </div>

            <!-- Registration Form -->
            <form id="registrationForm">

                <div class="form-group">

                    <label for="matricNumber">Matriculation Number</label>

                    <input
                        type="text"
                        id="matricNumber"
                        placeholder="e.g. TDT/20/2300"
                        maxlength="20"
                        required
                    >
                        <small class="input-hint">
                            Enter your FUTA matriculation number
                        </small>

                </div>

                <div class="form-group">

                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">

                    <label for="department">Department</label>
                    <input
                        type="text"
                        id="department"
                        placeholder="Enter your department"
                        maxlength="100"
                        required
                    >
                </div>


                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter an email address you can access"
                        maxlength="254"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Message Display -->
                <div id="registrationMessage" class="registration-message"
                    role="alert" aria-live="polite">
                </div>


                <!-- Submit Button -->
                <button type="submit" id="registerButton">
                    Create Account
                </button>

            </form>


            <!-- Login Link -->
            <div class="login-link">

                <p>
                    Already have an account?
                    <a href="login.html">Log in</a>
                </p>

            </div>


            <!-- Disclaimer -->
            <div class="project-disclaimer">

                <p>
                    Academic Project Prototype — For Demonstration Purposes Only.
                </p>

            </div>
        </div>
    </main>

    <script src="register.js"></script>

</body>

</html>
