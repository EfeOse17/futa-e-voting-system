<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Account | FUTA E-Voting</title>

    <link rel="stylesheet" href="verify-otp.css">
</head>

<body>

    <main class="verification-container">

        <div class="verification-card">

            <!-- Logo -->
            <div class="logo-container">
                <img src="../assets/futa-logo.png" alt="FUTA Logo">
            </div>

            <!-- Heading -->
            <div class="verification-heading">

                <h1>Verify Your Account</h1>

                <p>
                    Enter the six-digit verification code sent to your registered email address.
                </p>

            </div>


            <!-- OTP Form -->
            <form id="otpForm">

                <div class="form-group">

                    <label for="matricNumber">Matriculation Number</label>

                    <input
                        type="text"
                        id="matricNumber"
                        placeholder="Enter your matric number"
                        maxlength="20"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="otp">Verification Code</label>

                    <input
                        type="text"
                        id="otp"
                        placeholder="Enter 6-digit OTP"
                        maxlength="6"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        autocomplete="one-time-code"
                        required
                    >

                </div>


                <!-- Message -->
                <div
                    id="verificationMessage"
                    class="verification-message"
                    role="alert"
                    aria-live="polite">
                </div>


                <!-- Verify Button -->
                <button type="submit" id="verifyButton">
                    Verify Account
                </button>

            </form>

            <!--Resend button-->
            <div class="resend-container">
                <p>Didn't receive your code?</p>
                <button type="button" id="resendOtpButton">
                    Resend OTP
                </button>
            </div>


            <!-- Login Link -->
            <div class="login-link">

                <p>
                    Already verified?
                    <a href="login.html">Log in</a>
                </p>

            </div>


            <!-- Disclaimer -->
            <div class="project-disclaimer">

                <p>
                    Academic Project Prototype — For Demonstration Purposes Only.
                </p>

            </div>
        </div>
    </main>

    <script src="verify-otp.js"></script>

</body>

</html>
